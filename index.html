<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SET3">
<meta name="theme-color" content="#F6F0E3">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="favicon.ico">
<!--ART-HEAD-->
<title>SET3</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: mobile = one column + floating black pill nav with a pink centre +.
   Desktop (≥1000px) = black rounded sidebar + three-column dashboard.
   Single light theme on purpose: cream paper, ink, four pastel tones.
   Scale: type 11/12/13/14/16/18/22/26 · controls 34/40/44/48 · radii 10/14/20/24. */
:root{
  --bg:#F6F0E3;        /* cream paper */
  --card:#ECE4D3;      /* raised cream */
  --card-2:#E2D8C3;    /* pressed / track */
  --ink:#171614;
  --ink-2:#3B3934;
  --muted:#716C61;
  --line:rgba(23,22,20,.10);
  --yellow:#F2D877;
  --pink:#F2AACF;
  --green:#A3B56E;
  --blue:#B0C3EE;
  --red:#D9463F;
  --good:#3E6B2A;
  --font:'Rubik',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r-xl:24px;--r-lg:20px;--r-md:14px;--r-sm:10px;
  --ease:cubic-bezier(.22,1,.36,1);         /* settle */
  --ease-in:cubic-bezier(.4,0,1,1);         /* leave */
  --spring:cubic-bezier(.34,1.4,.64,1);     /* small overshoot */
  --t-press:.12s;--t-ui:.2s;--t-sheet:.34s;
  --gut:max(16px,env(safe-area-inset-left,0px));
  --gut-r:max(16px,env(safe-area-inset-right,0px));
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:90;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation}
button:disabled{cursor:default;opacity:.35}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:12px}
h1,h2,h3{margin:0;font-weight:500;text-wrap:balance;letter-spacing:-.02em}
p{margin:0}
.ic{width:18px;height:18px;flex-shrink:0}
.muted{color:var(--muted)}
.small{font-size:13px;color:var(--ink-2)}
.eyebrow{font-size:12px;color:var(--muted);margin-bottom:3px}
.tone-pink .eyebrow,.tone-yellow .eyebrow,.tone-green .eyebrow,.tone-blue .eyebrow,.tone-pink .muted,.tone-yellow .muted,.tone-green .muted{color:var(--ink-2)}

/* tones */
.t-yellow{background:var(--yellow)}.t-pink{background:var(--pink)}.t-green{background:var(--green)}.t-blue{background:var(--blue)}
.s-yellow{stroke:var(--yellow);background:var(--yellow)}.s-pink{stroke:var(--pink);background:var(--pink)}.s-green{stroke:var(--green);background:var(--green)}.s-blue{stroke:var(--blue);background:var(--blue)}
.tone-yellow{background:var(--yellow)}.tone-pink{background:var(--pink)}.tone-green{background:var(--green)}.tone-blue{background:var(--blue)}

/* ── Shell ── */
#app{min-height:100%}
#side{display:none}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:80;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px var(--gut-r) 6px var(--gut);height:56px}
.wordmark{font-size:18px;font-weight:700;letter-spacing:-.03em;display:flex;align-items:center;gap:8px}
.wordmark i{font-style:normal;display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;background:var(--pink);font-size:14px}
.top-r{display:flex;align-items:center;gap:8px;min-width:0}
#top-avatar{width:38px;height:38px;border-radius:13px;background:var(--pink);display:grid;place-items:center;font-weight:600;font-size:16px;position:relative;transition:transform var(--t-press) var(--ease)}
#top-avatar:active{transform:scale(.94)}
#top-avatar::after{content:"";position:absolute;right:-4px;top:-4px;width:12px;height:12px;background:var(--yellow);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.top-timer{display:flex;align-items:center;gap:7px;background:var(--ink);color:var(--yellow);border-radius:999px;padding:0 12px;height:34px;font-variant-numeric:tabular-nums;font-weight:500;font-size:14px;animation:pop .3s var(--spring) both}
.top-timer[hidden]{display:none}
.top-timer i{width:7px;height:7px;border-radius:50%;background:var(--pink);animation:pulse 1.2s ease-in-out infinite}
main{padding:2px var(--gut-r) calc(104px + env(safe-area-inset-bottom,0px)) var(--gut)}
.screen{display:none}
.screen.active{display:block}

/* entry motion: only when a screen is opened, never on re-render */
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes pop{from{opacity:0;transform:scale(.9)}}
@keyframes pulse{50%{opacity:.25}}
@keyframes grow{from{transform:scaleX(0)}}
.screen.enter .hello,.screen.enter .page-head,.screen.enter .col>*{animation:rise .42s var(--ease) both}
.screen.enter .col:nth-child(1)>*:nth-child(2){animation-delay:.04s}
.screen.enter .col:nth-child(1)>*:nth-child(3){animation-delay:.08s}
.screen.enter .col:nth-child(1)>*:nth-child(n+4){animation-delay:.1s}
.screen.enter .col:nth-child(2)>*{animation-delay:.06s}
.screen.enter .col:nth-child(2)>*:nth-child(n+3){animation-delay:.1s}
.screen.enter .col:nth-child(3)>*{animation-delay:.1s}
.screen.enter .meter i,.ov .meter i{animation:grow .7s var(--ease) .15s both;transform-origin:left}

/* bottom nav */
#tabs{position:fixed;z-index:85;left:var(--gut);right:var(--gut-r);bottom:calc(12px + env(safe-area-inset-bottom,0px));height:60px;border-radius:30px;background:var(--ink);display:grid;grid-template-columns:1fr 1fr 74px 1fr 1fr;align-items:center;max-width:480px;margin:0 auto;box-shadow:0 8px 24px rgba(23,22,20,.22)}
.tab{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:#9C968A;font-size:10.5px;position:relative;transition:color var(--t-ui) var(--ease)}
.tab .ic{width:20px;height:20px;transition:transform var(--t-ui) var(--spring)}
.tab:active .ic{transform:scale(.88)}
.tab.on{color:var(--bg)}
.tab::after{content:"";position:absolute;bottom:7px;width:16px;height:2px;border-radius:2px;background:var(--pink);transform:scaleX(0);transition:transform .28s var(--ease)}
.tab.on::after{transform:scaleX(1)}
.tab.live .ic{color:var(--pink)}
.tab-plus{width:54px;height:54px;border-radius:50%;background:var(--pink);display:grid;place-items:center;margin:-30px auto 0;border:5px solid var(--bg);box-sizing:content-box;color:var(--ink);transition:transform var(--t-press) var(--ease)}
.tab-plus:active{transform:scale(.92)}
.tab-plus .ic{width:24px;height:24px}

/* ── Type & headers ── */
.hello{padding:8px 0 4px}
.hello h1{font-size:26px;line-height:1.12}
.hello .muted{font-size:14px;margin-top:2px}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0 12px}
.page-head h1{font-size:28px;line-height:1.08}
.grow1{flex:1;min-width:0}
h2.sec{font-size:16px;margin:16px 2px 8px}
.col>h2.sec:first-child{margin-top:2px}
.card h3{font-size:18px;line-height:1.2;margin-bottom:5px}
.card p{color:var(--ink-2)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.card-head h3{margin:0;font-size:16px}
.h-sub{font-size:13px;font-weight:400;color:var(--ink-2);letter-spacing:0;white-space:nowrap}

/* ── Layout ── */
.cols{display:flex;flex-direction:column;gap:12px}
.col{display:flex;flex-direction:column;gap:12px;min-width:0}
.col>h2.sec{margin-bottom:-4px}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 18px;font-weight:500;font-size:14px;min-height:42px;line-height:1.2;text-align:center;transition:transform var(--t-press) var(--ease),background-color var(--t-ui),box-shadow var(--t-ui)}
.btn .ic{width:16px;height:16px}
.btn:active{transform:scale(.96)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.sm{min-height:34px;padding:7px 14px;font-size:13px;margin-top:12px}
.btn.big{min-height:48px;padding:12px 20px;font-size:15px;flex:1}
.btn.wide{width:100%}
.btn.danger{background:var(--red);color:#fff}
.danger-text{color:var(--red)!important;box-shadow:inset 0 0 0 1.5px var(--red)!important}
.circle{width:40px;height:40px;border-radius:50%;background:var(--card);display:grid;place-items:center;flex-shrink:0;color:var(--ink);transition:transform var(--t-press) var(--ease),background-color var(--t-ui)}
.circle:active{transform:scale(.92)}
.circle.sm{width:32px;height:32px}
.circle.sm .ic{width:15px;height:15px}
.circle.flip .ic{transform:scaleX(-1)}
.circle.dashed{background:transparent;border:1.5px dashed var(--ink-2)}
.tone-pink .circle,.tone-yellow .circle{background:rgba(255,255,255,.45)}
.row-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.row-btns .btn{flex:1 1 auto;min-width:min(100%,120px);white-space:nowrap}
.link{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;margin-top:12px;align-self:flex-start;text-align:left}
.link .ic{width:15px;height:15px}
.card-head .link{margin-top:0}
.plan-card .link{display:flex;margin-top:10px}
@media (hover:hover) and (pointer:fine){
  .btn:hover{background:#2E2C28}
  .btn.ghost:hover{background:rgba(23,22,20,.06)}
  .btn.danger:hover{background:#C23C36}
  .circle:hover{background:var(--card-2)}
  .tone-pink .circle:hover{background:rgba(255,255,255,.65)}
  .link:hover{color:var(--ink)}
  .chip:hover{background:var(--card-2)}
  .chip.on:hover{background:var(--ink)}
}

/* ── Cards ── */
.card{background:var(--card);border-radius:var(--r-xl);padding:18px;position:relative;overflow:hidden}
.cta,.highlights,.wd,button.row,.gtile,.chip,.cd,.mood button,.dow button{transition:transform var(--t-press) var(--ease),background-color var(--t-ui) var(--ease),box-shadow var(--t-ui) var(--ease),color var(--t-ui)}
.cta{cursor:pointer}
.cta:active,.highlights:active{transform:scale(.985)}
.cta .btn{pointer-events:none}
.coach::after{content:"";position:absolute;right:-24px;bottom:-30px;width:150px;height:130px;background:rgba(255,255,255,.28);clip-path:path('M75 128C75 128 4 84 4 40C4 18 20 2 42 2C57 2 68 10 75 22C82 10 93 2 108 2C130 2 146 18 146 40C146 84 75 128 75 128Z');pointer-events:none}
.coach>*{position:relative;z-index:1}
.coach.big h3{font-size:22px}
.why-lbl{font-size:12px;color:var(--ink-2);margin-top:14px;font-weight:500}
.ov .why-lbl{color:var(--muted)}
.why{margin:8px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:7px}
.why li{font-size:13.5px;color:var(--ink-2);padding-left:16px;position:relative}
.why li::before{content:"";position:absolute;left:2px;top:7px;width:6px;height:6px;border-radius:50%;background:var(--ink)}
.why.compact li{padding-left:0}
.why.compact li::before{display:none}
.next-up{display:flex;gap:10px;align-items:flex-start;background:rgba(255,255,255,.4);border-radius:var(--r-md);padding:10px 12px;margin-top:12px}
.next-up .dot{width:32px;height:32px}
.next-up .dot .ic{width:16px;height:16px}
.next-up small{font-size:11.5px;color:var(--ink-2)}
.next-up b{display:block;font-weight:500;font-size:15px;line-height:1.25}
.next-up p{font-size:13px;margin-top:2px}

/* ring */
.ring{position:relative;max-width:290px;width:100%;margin:0 auto;aspect-ratio:1}
.ring-svg{width:100%;height:100%;display:block;overflow:visible}
.arc{fill:none;stroke-width:36;stroke-linecap:round;transition:stroke-width .22s var(--ease)}
.arc.off{stroke:var(--card-2)}
.arc-hit{fill:none;stroke:transparent;stroke-width:58;stroke-linecap:round}
.seg-g{cursor:pointer;outline:none;transform-box:view-box;transform-origin:150px 150px;transition:transform .22s var(--ease)}
.seg-g:hover .arc,.seg-g:focus-visible .arc{stroke-width:41}
.seg-g:active{transform:scale(.97)}
.screen.enter .seg-g{animation:segIn .5s var(--ease) both;animation-delay:calc(var(--i) * 35ms + 60ms)}
@keyframes segIn{from{opacity:0;transform:scale(.86) rotate(-8deg)}}
.ring-ic{color:var(--ink);pointer-events:none}
.ring-ic.off{color:var(--muted)}
.ring-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.ring-mid b{font-size:68px;font-weight:500;line-height:.95;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.ring-mid span{font-size:14px;color:var(--ink-2);margin-top:4px}
.ring-mid small{font-size:11.5px;color:var(--muted);margin-top:2px}
.ring-hint{text-align:center;font-size:11.5px;color:var(--muted);margin-top:-4px}
.actions{display:flex;gap:8px;align-items:center}

/* highlights */
.highlights{cursor:pointer}
.hl-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.hl{position:relative;aspect-ratio:1;min-width:0}
.hl-shape{position:absolute;inset:0;width:100%;height:100%}
.hl-shape.t-pink{fill:var(--pink);background:none}.hl-shape.t-blue{fill:var(--blue);background:none}.hl-shape.t-yellow{fill:var(--yellow);background:none}.hl-shape.t-green{fill:var(--green);background:none}
.hl-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.hl-txt b{font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1;white-space:nowrap}
.hl-txt b small{font-size:10px;font-weight:500}
.hl-txt span{font-size:10.5px;color:var(--ink-2)}

/* lists */
.list{background:var(--card);border-radius:var(--r-lg);padding:5px;display:flex;flex-direction:column}
.list.flat{background:transparent;padding:0}
.row{display:flex;align-items:center;gap:11px;padding:10px 9px;border-radius:15px;text-align:left;width:100%;min-width:0}
button.row:active{transform:scale(.985);background:var(--card-2)}
@media (hover:hover) and (pointer:fine){button.row:hover{background:var(--card-2)}}
.row.static{cursor:default}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row-main b{font-weight:500;font-size:14px}
.row-main small{font-size:12px;color:var(--muted)}
.row-main .note-sm{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--muted);display:flex}
.chev .ic{width:16px;height:16px}
.dot{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;color:var(--ink)}
.dot .ic{width:17px;height:17px}
.badge{background:var(--ink);color:var(--bg);font-size:11px;font-weight:500;padding:2px 7px;border-radius:7px;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);padding:14px 10px;font-size:13px}
.vals{display:flex;align-items:baseline;gap:4px;font-variant-numeric:tabular-nums}
.vals b{font-weight:500;font-size:15px;margin-left:10px}
.vals small{font-size:11px;color:var(--muted)}
.mini-chips{display:flex;gap:4px;flex-wrap:wrap;margin:3px 0 1px}
.mini-chips i{font-style:normal;font-size:10.5px;padding:1px 6px;border-radius:5px}
.mood-dot{width:34px;height:34px;border-radius:50%;background:var(--pink);display:grid;place-items:center;font-weight:600;flex-shrink:0;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:4px;flex-shrink:0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--card-2)}
.dots i.on{background:var(--ink)}

/* chips */
.chips{display:flex;gap:6px}
.chips.wrap{flex-wrap:wrap;margin-top:10px}
.chips.scroll{overflow-x:auto;scrollbar-width:none;padding:2px;margin:-2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-size:12.5px;padding:6px 12px;border-radius:999px;background:var(--card);color:var(--ink-2)}
.chip:active{transform:scale(.95)}
.chip .ic{width:13px;height:13px}
.chip.on{background:var(--ink);color:var(--bg)}
.gchip{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;padding:5px 11px 5px 7px;border-radius:999px;box-shadow:inset 0 0 0 1.5px rgba(23,22,20,.18);white-space:nowrap}
.gchip .ic{width:14px;height:14px}
.tone-pink .gchip{box-shadow:inset 0 0 0 1.5px rgba(23,22,20,.22)}
.note{font-size:13px;color:var(--ink-2);padding:0 4px}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.tiles.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.tile{border-radius:var(--r-lg);padding:12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile span{font-size:11.5px;color:var(--ink-2);line-height:1.25}
.tile b{font-size:26px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.tile b small{font-size:13px;font-weight:400}
.tile>small{font-size:10.5px;color:var(--ink-2);line-height:1.3}
.tile small.good{color:var(--good);font-weight:500;font-size:11.5px}
.tile small.bad{color:var(--red);font-weight:500;font-size:11.5px}

/* week strip */
.week-strip{padding:14px 12px}
.wd-row{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.wd{display:flex;flex-direction:column;align-items:center;gap:5px;padding:7px 0 8px;border-radius:14px;min-width:0}
.wd:active{transform:scale(.95)}
@media (hover:hover) and (pointer:fine){.wd:hover{background:var(--card-2)}}
.wd.is-today{background:var(--bg);box-shadow:inset 0 0 0 1.5px var(--ink)}
.wd-top{display:flex;flex-direction:column;align-items:center;line-height:1.1}
.wd-top i{font-style:normal;font-size:10.5px;color:var(--muted)}
.wd-top b{font-size:13px;font-weight:500;font-variant-numeric:tabular-nums}
.wd-dot{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;color:var(--ink)}
.wd-dot .ic{width:15px;height:15px}
.wd-dot.off{background:transparent;box-shadow:inset 0 0 0 1.5px var(--card-2);color:var(--muted)}
.wd.planned .wd-dot:not(.off){opacity:.55}
.wd.done .wd-dot{box-shadow:0 0 0 2px var(--card),0 0 0 3.5px var(--ink)}
.wd-lbl{font-size:10px;color:var(--ink-2);text-align:center;line-height:1.15;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 1px}
.wd.off .wd-lbl,.wd.planned .wd-lbl{color:var(--muted)}
.wd-note{margin-top:10px;padding:0 4px;font-size:11.5px}
.l-short{display:none}
@media (max-width:370px){.l-long{display:none}.l-short{display:inline}}

/* plan card */
.plan-card h3{font-size:17px}
.plan-week{display:flex;flex-direction:column;margin:12px 0;background:rgba(255,255,255,.35);border-radius:var(--r-md);padding:4px 10px}
.pw{display:grid;grid-template-columns:34px 10px minmax(0,auto) minmax(0,1fr);align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid var(--line)}
.pw:last-child{border-bottom:0}
.pw span{font-size:12px;color:var(--muted)}
.pw i{width:10px;height:10px;border-radius:50%}
.pw b{font-weight:500;font-size:13.5px;white-space:nowrap}
.pw small{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* session moves */
.moves{background:var(--card);border-radius:var(--r-md);padding:2px 14px}
.mv{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.mv:last-child{border-bottom:0}
.mv b{font-weight:500;font-size:14px;min-width:0}
.mv span{font-size:13px;color:var(--ink-2);white-space:nowrap;font-variant-numeric:tabular-nums}

/* muscle group rows */
.groups{display:flex;flex-direction:column;gap:12px}
.grow{display:flex;gap:11px;align-items:center}
.grow-main{flex:1;min-width:0}
.grow-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grow-top b{font-weight:500;font-size:14px}
.grow small{font-size:11.5px;color:var(--muted)}
.meter{height:7px;border-radius:4px;background:var(--card-2);margin:5px 0 3px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:4px}
.st{font-size:10.5px;padding:2px 7px;border-radius:6px;background:var(--card-2);white-space:nowrap}
.st.on{background:var(--ink);color:var(--bg)}
.st.rec{background:var(--blue)}
.st.ready{background:var(--yellow)}

/* timer */
.timer{background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px}
.timer .eyebrow{color:#A9A398}
.timer b{display:block;font-size:38px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.05}
.timer small{color:#A9A398;font-size:12px}
.play{width:56px;height:56px;border-radius:50%;background:var(--pink);color:var(--ink);display:grid;place-items:center;flex-shrink:0;transition:transform var(--t-press) var(--ease),background-color var(--t-ui)}
.play:active{transform:scale(.92)}
.play .ic{width:22px;height:22px;fill:currentColor}
.timer.running .play{background:var(--yellow)}
.home-timer{align-items:flex-start}
.ht-main{flex:1;min-width:0}
.ht-bar{height:5px;border-radius:3px;background:#3A3732;margin-top:10px;overflow:hidden}
.ht-bar i{display:block;height:100%;background:var(--yellow);border-radius:3px;transition:width 1s linear}

/* baseline */
.stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.stat{background:rgba(255,255,255,.4);border-radius:12px;padding:9px 10px;display:flex;flex-direction:column;min-width:0}
.stat span{font-size:10.5px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat b{font-size:15px;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat b small{font-size:10.5px;font-weight:400}
.baseline .small{margin-top:10px}

/* calendar */
.cal .card-head{margin-bottom:8px}
.pill-label{background:var(--pink);padding:5px 13px;border-radius:999px;font-size:13px;font-weight:500}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.cw{font-size:10.5px;color:var(--muted);padding-bottom:4px}
.cd{aspect-ratio:1;border-radius:50%;font-size:13px;display:grid;place-items:center;font-variant-numeric:tabular-nums;justify-self:center;width:100%;max-width:38px}
.cd:not(:disabled):active{transform:scale(.9)}
.cd.td{box-shadow:inset 0 0 0 2px var(--ink);font-weight:600}
.cd.fut{color:var(--muted);opacity:.5}

/* history */
.seg{display:inline-flex;background:var(--card);border-radius:999px;padding:3px;gap:2px;align-self:flex-start}
.seg button{padding:6px 14px;border-radius:999px;font-size:13px;color:var(--ink-2);transition:background-color var(--t-ui) var(--ease),color var(--t-ui)}
.seg button.on{background:var(--ink);color:var(--bg)}
.period{display:flex;flex-direction:column;gap:6px}
.period-head{display:flex;justify-content:space-between;align-items:baseline;padding:4px 4px 0}
.period-head b{font-weight:500;font-size:14px}
.period-head span{font-size:12px;color:var(--muted)}

/* daily */
.week .bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-bottom:12px}
.bar-col{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.bar-val{font-size:11px;font-weight:600;height:15px;font-variant-numeric:tabular-nums}
.bar-track{width:100%;height:80px;border-radius:10px;background:rgba(255,255,255,.45);display:flex;align-items:flex-end;overflow:hidden}
.bar{width:100%;background:var(--ink);border-radius:10px;transform-origin:bottom}
.screen.enter .bar{animation:barUp .6s var(--ease) .15s both}
@keyframes barUp{from{transform:scaleY(0)}}
.bar-lbl{font-size:10.5px;color:var(--ink-2)}
.bar-lbl.td{font-weight:700;color:var(--ink)}
.weeks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.wk{background:var(--card);border-radius:16px;padding:10px;display:flex;flex-direction:column;min-width:0}
.wk span{font-size:10.5px;color:var(--muted)}
.wk b{font-size:20px;font-weight:500;font-variant-numeric:tabular-nums}
.wk small{font-size:10.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wk.fut{opacity:.45}
.rules{margin:12px 0;padding:0;list-style:none;counter-reset:r;display:flex;flex-direction:column;gap:9px}
.rules li{counter-increment:r;display:flex;gap:10px;align-items:flex-start;font-size:14px}
.rules li::before{content:counter(r);width:22px;height:22px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:11.5px;flex-shrink:0;margin-top:-1px}
.small-rules li{font-size:13.5px;color:var(--ink-2)}
.flag h3{font-size:19px}
.flag-help{font-size:12.5px;margin-top:10px}
.sel{user-select:all;-webkit-user-select:all;font-size:14px}

/* forms */
.lbl{display:block;font-size:12px;color:var(--muted);margin:14px 2px 6px}
.inp{width:100%;background:var(--card);border:0;border-radius:var(--r-md);padding:11px 13px;font:inherit;font-size:16px;color:var(--ink);outline:none;-webkit-appearance:none;appearance:none;min-height:44px;transition:box-shadow var(--t-ui)}
.inp:focus{box-shadow:inset 0 0 0 2px var(--ink)}
textarea.inp{resize:vertical;min-height:64px;line-height:1.45}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.two .lbl{margin-top:14px}
.hint{font-size:12.5px;color:var(--muted);margin-top:8px;display:flex;gap:6px;align-items:flex-start}
.hint .ic{width:15px;height:15px;margin-top:1px}
.mood{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.mood button{aspect-ratio:1;border-radius:50%;background:var(--card);font-weight:500;font-size:13px;font-variant-numeric:tabular-nums;min-width:0}
.mood button:active{transform:scale(.88)}
.mood button.on{background:var(--pink);box-shadow:inset 0 0 0 2px var(--ink);transform:scale(1.06)}
.mood-ends{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);margin-top:6px}
.toggles{background:var(--card);border-radius:18px;padding:4px}
.tg-row{display:flex;align-items:center;gap:11px;padding:9px;border-radius:14px;cursor:pointer;transition:background-color var(--t-ui)}
.tg-row:active{background:var(--card-2)}
@media (hover:hover) and (pointer:fine){.tg-row:hover{background:var(--card-2)}}
.tg-row.locked{cursor:default}.tg-row.locked:hover,.tg-row.locked:active{background:none}
.tg-row .dot{width:32px;height:32px}
.tg-row .dot .ic{width:16px;height:16px}
.tg-main{flex:1;min-width:0;display:flex;flex-direction:column}
.tg-main b{font-weight:500;font-size:14px}
.tg-main small{font-size:11.5px;color:var(--muted)}
.switch{width:42px;height:26px;border-radius:13px;background:var(--card-2);position:relative;flex-shrink:0;transition:background-color .2s var(--ease)}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(23,22,20,.15);transition:transform .28s var(--spring),background-color .2s}
.switch.on{background:var(--ink)}
.switch.on::after{transform:translateX(16px);background:var(--pink)}
.tg-row.locked .switch{opacity:.6}
.range{width:100%;accent-color:var(--ink);height:26px}
.ticks{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted)}
.dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:12px}
.dow button{aspect-ratio:1;border-radius:50%;background:var(--card);font-weight:500;min-width:0}
.dow button:active{transform:scale(.9)}
.dow button.on{background:var(--ink);color:var(--bg)}

/* group tiles in logger */
.gtiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.gtile{background:var(--card);border-radius:18px;padding:10px 11px;display:flex;align-items:center;gap:9px;text-align:left;position:relative;min-height:56px;min-width:0}
.gtile:active{transform:scale(.97)}
.gtile b{font-weight:500;font-size:13.5px;line-height:1.2;min-width:0;padding-right:18px}
.gtile .dot{width:32px;height:32px;transition:background-color var(--t-ui)}
.gtile .dot .ic{width:16px;height:16px}
.gtile.on.t-yellow{background:var(--yellow)}.gtile.on.t-pink{background:var(--pink)}.gtile.on.t-green{background:var(--green)}.gtile.on.t-blue{background:var(--blue)}
.gtile:not(.on){background:var(--card)}
.gtile.on .dot{background:rgba(255,255,255,.55)}
.gtile em{position:absolute;top:5px;right:7px;font-style:normal;font-size:9.5px;background:var(--ink);color:var(--bg);padding:1px 6px;border-radius:6px}
.gtile .tick{position:absolute;top:7px;right:7px;width:18px;height:18px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;animation:pop .28s var(--spring) both}
.gtile .tick .ic{width:12px;height:12px}

/* profile */
.who{display:flex;gap:14px;align-items:center;padding:4px 0 2px;min-width:0}
.who>div:last-child{min-width:0}
.who h1{font-size:28px;line-height:1.08;overflow-wrap:anywhere}
.avatar{width:80px;height:80px;border-radius:22px;background:var(--pink);display:grid;place-items:center;font-size:34px;font-weight:600;position:relative;flex-shrink:0}
.spark{position:absolute;right:-9px;top:-9px;width:32px;height:32px;background:var(--yellow);clip-path:polygon(50% 0,63% 20%,88% 12%,80% 37%,100% 50%,80% 63%,88% 88%,63% 80%,50% 100%,37% 80%,12% 88%,20% 63%,0 50%,20% 37%,12% 12%,37% 20%);display:grid;place-items:center;transition:transform .3s var(--spring)}
.spark:active{transform:rotate(30deg) scale(.92)}
.spark .ic{width:13px;height:13px}
.facts{display:flex;gap:14px;margin-top:6px;flex-wrap:wrap}
.facts span{font-size:10.5px;color:var(--muted);display:flex;flex-direction:column;text-transform:uppercase;letter-spacing:.05em}
.facts b{font-size:14px;color:var(--ink);font-weight:500;text-transform:none;letter-spacing:0;font-variant-numeric:tabular-nums}
.idbar{background:var(--green);border-radius:999px;padding:9px 16px;display:flex;justify-content:space-between;gap:4px 10px;font-size:12.5px;flex-wrap:wrap}
.sources{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.src{background:var(--card);border-radius:var(--r-md);padding:11px 13px}
.src b{font-weight:500;font-size:14px}
.src p{font-size:13px;color:var(--ink-2);margin:2px 0 4px}
.src small{font-size:11.5px;color:var(--muted)}

/* group insight & plan sheets */
.ins-head{display:flex;align-items:center;gap:12px;min-width:0}
.ins-head>div{flex:1;min-width:0}
.ins-head h3{margin:0;font-size:20px}
.ins-head .eyebrow{margin:0}
.dot.big{width:46px;height:46px}
.dot.big .ic{width:21px;height:21px}
.ins-count{display:flex;align-items:baseline;gap:8px;margin-top:14px}
.ins-count b{font-size:40px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
.ins-count span{color:var(--ink-2);font-size:13.5px}
.meter.big{height:10px;border-radius:5px;margin:10px 0 12px}
.ins-line{color:var(--ink-2);font-size:13.5px}
.ins-box{background:var(--card);border-radius:var(--r-lg);padding:13px 15px;margin-top:14px;display:flex;flex-direction:column;gap:3px}
.ins-box b{font-weight:500;font-size:12px;color:var(--muted);margin-top:8px}
.ins-box b:first-child{margin-top:0}
.ins-box p{font-size:13.5px}
.ins-box ul{margin:2px 0 0;padding-left:18px;font-size:13.5px;display:flex;flex-direction:column;gap:2px}
.note-block{background:var(--card);border-radius:var(--r-md);padding:11px 13px;font-size:13.5px;color:var(--ink-2);overflow-wrap:anywhere}
.locked-line{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13px;color:var(--ink-2);background:var(--card);border-radius:12px;padding:9px 12px}
.locked-line .ic{width:15px;height:15px}

/* overlays: backdrop fades, sheet slides; both reverse on close */
.ov{position:fixed;inset:0;z-index:200;background:rgba(23,22,20,.34);display:flex;align-items:flex-end;justify-content:center;animation:ovIn .22s var(--ease) both}
.ov.closing{animation:ovOut .2s var(--ease-in) both;pointer-events:none}
@keyframes ovIn{from{background:rgba(23,22,20,0)}}
@keyframes ovOut{to{background:rgba(23,22,20,0)}}
.modal{background:var(--bg);width:100%;max-width:540px;max-height:90vh;overflow-y:auto;border-radius:24px 24px 0 0;padding:18px var(--gut-r) calc(22px + env(safe-area-inset-bottom,0px)) var(--gut);animation:sheetIn var(--t-sheet) var(--ease) both;overscroll-behavior:contain;will-change:transform}
.ov.closing .modal{animation:sheetOut .2s var(--ease-in) both}
.modal.dragging{animation:none;transition:none}
.modal.settle{transition:transform .28s var(--ease)}
@keyframes sheetIn{from{transform:translateY(100%)}}
@keyframes sheetOut{to{transform:translateY(100%)}}
.modal h3{font-size:20px;margin-bottom:5px}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:2px}
.modal-head>div{min-width:0}
.modal-head h2{font-size:22px}
.grab{width:36px;height:4px;border-radius:2px;background:var(--card-2);margin:-6px auto 12px}

#toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,10px) scale(.96);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;z-index:300;opacity:0;pointer-events:none;transition:opacity .2s var(--ease),transform .3s var(--spring);max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0) scale(1)}


/* hold-to-pick chips */
.gchip.hold{cursor:pointer;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;transition:transform var(--t-press) var(--ease),box-shadow var(--t-ui)}
.gtile{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.gchip.hold:active{transform:scale(.96)}
.holding{transform:scale(.93)!important;transition:transform .42s linear!important;box-shadow:inset 0 0 0 2px var(--ink)!important}
.hold-hint{font-size:11.5px;color:var(--ink-2);margin-top:7px;opacity:.8}
.ov .hold-hint{color:var(--muted)}
.lbl-tag{font-size:11px;color:var(--muted);margin-left:6px;font-weight:400}
.lbl-tag::before{content:"· "}
.mv b{display:flex;align-items:center;gap:8px}
.mv-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;background:var(--card-2)}

/* exercise picker */
.ov.stacked{z-index:210;background:rgba(23,22,20,.22)}
.px-search{margin-top:12px;min-height:40px;padding:9px 13px;font-size:15px}
.px-body{margin-top:6px}
.px-sec{margin-top:12px}
.px-sec[hidden]{display:none}
.px-lbl{font-size:11.5px;color:var(--muted);margin:0 2px 7px}
.px-chips,.ex-list{display:flex;flex-wrap:wrap;gap:6px}
.xchip{display:inline-flex;align-items:center;gap:5px;font-size:13px;line-height:1.25;padding:7px 12px;border-radius:999px;background:var(--card);color:var(--muted);text-align:left;max-width:100%;transition:background-color .18s var(--ease),color .18s,transform var(--t-press) var(--ease),opacity .18s}
.xchip[hidden]{display:none}
.xchip:not(.on){opacity:.72}
.xchip:active{transform:scale(.95)}
.xchip.on{color:var(--ink);opacity:1;box-shadow:inset 0 0 0 1.5px rgba(23,22,20,.16)}
.x-tick{display:none;width:15px;height:15px;border-radius:50%;background:var(--ink);color:var(--bg);place-items:center;flex-shrink:0}
.x-tick .ic{width:10px;height:10px}
.xchip.on .x-tick{display:grid;animation:pop .25s var(--spring) both}
.x-coach{display:inline-flex;color:var(--ink-2);margin-left:1px}
.x-coach .ic{width:12px;height:12px}
.xchip.mini{font-size:12px;padding:5px 10px}
.xchip.on.t-yellow,.mv-dot.t-yellow{background:var(--yellow)}.xchip.on.t-pink,.mv-dot.t-pink{background:var(--pink)}.xchip.on.t-green,.mv-dot.t-green{background:var(--green)}.xchip.on.t-blue,.mv-dot.t-blue{background:var(--blue)}
.mv small{font-size:12px;color:var(--muted);white-space:nowrap}
.px-picked{margin-top:12px;background:var(--card);border-radius:var(--r-md);padding:10px 12px}
.px-picked .px-lbl{margin:0 0 7px}
.px-picked .hint{margin:0}
.px-tabs{margin-top:10px;gap:6px}
.px-tabs .chip{font-size:12px;padding:6px 11px}
.px-tabs .chip i{font-style:normal;opacity:.6;margin-left:2px;font-variant-numeric:tabular-nums}

.px-add{display:flex;gap:8px;margin-top:16px}

.px-foot{position:sticky;bottom:calc(-22px - env(safe-area-inset-bottom,0px));z-index:2;margin:14px calc(-1 * var(--gut-r)) calc(-22px - env(safe-area-inset-bottom,0px)) calc(-1 * var(--gut));padding:12px var(--gut-r) calc(14px + env(safe-area-inset-bottom,0px)) var(--gut);background:var(--bg);border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:12px}

  main{padding:24px max(28px,env(safe-area-inset-right,0px)) 40px 18px;max-width:1440px}

  .cols.pair{grid-template-columns:repeat(2,minmax(0,1fr))}
  .ov{align-items:center;padding:24px}
  .modal{border-radius:24px;max-height:86vh;padding:22px 26px;animation:dlgIn .26s var(--ease) both}
  .ov.closing .modal{animation:dlgOut .16s var(--ease-in) both}
  @keyframes dlgIn{from{opacity:0;transform:translateY(10px) scale(.97)}}
  @keyframes dlgOut{to{opacity:0;transform:translateY(6px) scale(.98)}}
  .grab{display:none}
  .gtiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .gtile{flex-direction:column;align-items:flex-start;min-height:92px}
  #toast{bottom:28px}
}
@media (min-width:1000px) and (max-width:1240px){
  .cols{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cols>.col:nth-child(3){grid-column:1 / -1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
  .cols>.col:nth-child(3)>h2.sec{grid-column:1 / -1}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
<!--/ART-HEAD-->
