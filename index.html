<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="SET3">
<meta name="theme-color" content="#F6F0E3">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="favicon.ico">
<!--ART-HEAD-->
<title>SET3</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: mobile = one column + floating black pill nav with a pink centre +.
   Desktop (≥1000px) = black rounded sidebar + three-column dashboard.
   Single light theme on purpose: cream paper, ink, four pastel tones. */
:root{
  --bg:#F6F0E3;        /* cream paper */
  --card:#ECE4D3;      /* raised cream */
  --card-2:#E2D8C3;    /* pressed / track */
  --ink:#171614;
  --ink-2:#3B3934;
  --muted:#716C61;
  --line:rgba(23,22,20,.10);
  --yellow:#F2D877;
  --pink:#F2AACF;
  --green:#A3B56E;
  --blue:#B0C3EE;
  --red:#D9463F;
  --good:#3E6B2A;
  --font:'Rubik',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --r-xl:28px;--r-lg:22px;--r-md:16px;
  --gut:max(16px,env(safe-area-inset-left,0px));
  --gut-r:max(16px,env(safe-area-inset-right,0px));
  color-scheme:light;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:90;background:var(--bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:disabled{cursor:default;opacity:.35}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:12px}
h1,h2,h3{margin:0;font-weight:500;text-wrap:balance;letter-spacing:-.02em}
p{margin:0}
.ic{width:20px;height:20px;flex-shrink:0}
.muted{color:var(--muted)}
.small{font-size:13px;color:var(--ink-2)}
.eyebrow{font-size:13px;color:var(--muted);margin-bottom:4px}
.tone-pink .eyebrow,.tone-yellow .eyebrow,.tone-green .eyebrow,.tone-blue .eyebrow,.tone-pink .muted,.tone-yellow .muted,.tone-green .muted{color:var(--ink-2)}

/* tones */
.t-yellow{background:var(--yellow)}.t-pink{background:var(--pink)}.t-green{background:var(--green)}.t-blue{background:var(--blue)}
.s-yellow{stroke:var(--yellow);background:var(--yellow)}.s-pink{stroke:var(--pink);background:var(--pink)}.s-green{stroke:var(--green);background:var(--green)}.s-blue{stroke:var(--blue);background:var(--blue)}
.tone-yellow{background:var(--yellow)}.tone-pink{background:var(--pink)}.tone-green{background:var(--green)}.tone-blue{background:var(--blue)}

/* ── Shell ── */
#app{min-height:100%}
#side{display:none}
#top{position:sticky;top:env(safe-area-inset-top,0px);z-index:80;background:var(--bg);display:flex;align-items:center;justify-content:space-between;padding:10px var(--gut-r) 6px var(--gut)}
.wordmark{font-size:20px;font-weight:700;letter-spacing:-.03em;display:flex;align-items:center;gap:8px}
.wordmark i{font-style:normal;display:inline-grid;place-items:center;width:28px;height:28px;border-radius:9px;background:var(--pink);font-size:15px}
#top-avatar{width:44px;height:44px;border-radius:15px;background:var(--pink);display:grid;place-items:center;font-weight:600;font-size:18px;position:relative}
#top-avatar::after{content:"";position:absolute;right:-4px;top:-4px;width:14px;height:14px;background:var(--yellow);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
main{padding:4px var(--gut-r) calc(116px + env(safe-area-inset-bottom,0px)) var(--gut)}
.screen{display:none}
.screen.active{display:block;animation:fade .25s ease}
@keyframes fade{from{opacity:.4;transform:translateY(4px)}}

/* bottom nav */
#tabs{position:fixed;z-index:85;left:var(--gut);right:var(--gut-r);bottom:calc(12px + env(safe-area-inset-bottom,0px));height:68px;border-radius:34px;background:var(--ink);display:grid;grid-template-columns:1fr 1fr 84px 1fr 1fr;align-items:center;max-width:520px;margin:0 auto;box-shadow:0 10px 30px rgba(23,22,20,.25)}
.tab{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:#9C968A;font-size:11px;position:relative}
.tab .ic{width:22px;height:22px}
.tab.on{color:var(--bg)}
.tab.on::after{content:"";position:absolute;bottom:9px;width:18px;height:2px;border-radius:2px;background:var(--pink)}
.tab.live .ic{color:var(--pink)}
.tab-plus{width:64px;height:64px;border-radius:50%;background:var(--pink);display:grid;place-items:center;margin:-34px auto 0;border:6px solid var(--bg);box-sizing:content-box;color:var(--ink)}
.tab-plus .ic{width:28px;height:28px}

/* ── Type & headers ── */
.hello{padding:10px 0 6px}
.hello h1{font-size:30px;line-height:1.1}
.page-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0 14px}
.page-head h1{font-size:34px;line-height:1.05}
.grow1{flex:1}
h2.sec{font-size:18px;margin:18px 2px 10px}
.col>h2.sec:first-child{margin-top:4px}
.card h3{font-size:21px;line-height:1.15;margin-bottom:6px}
.card p{color:var(--ink-2)}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.card-head h3{margin:0;font-size:18px}

/* ── Layout ── */
.cols{display:flex;flex-direction:column;gap:14px}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.col>h2.sec{margin-bottom:-4px}

/* ── Buttons ── */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--ink);color:var(--bg);border-radius:999px;padding:12px 20px;font-weight:500;font-size:15px;min-height:46px;transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.btn.sm{min-height:38px;padding:8px 16px;font-size:14px;margin-top:12px}
.btn.big{min-height:54px;padding:14px 22px;font-size:16px;flex:1}
.btn.wide{width:100%}
.btn.danger{background:var(--red);color:#fff}
.danger-text{color:var(--red)!important;box-shadow:inset 0 0 0 1.5px var(--red)!important}
.circle{width:48px;height:48px;border-radius:50%;background:var(--card);display:grid;place-items:center;flex-shrink:0;color:var(--ink)}
.circle.sm{width:36px;height:36px}
.circle.sm .ic{width:17px;height:17px}
.circle.flip .ic{transform:scaleX(-1)}
.circle.dashed{background:transparent;border:1.5px dashed var(--ink-2)}
.tone-pink .circle,.tone-yellow .circle{background:rgba(255,255,255,.45)}
.row-btns{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.row-btns .btn{flex:1;min-width:130px}
.link{display:inline-flex;align-items:center;gap:6px;font-size:14px;color:var(--ink-2);text-decoration:underline;text-underline-offset:3px;margin-top:14px}
.link .ic{width:16px;height:16px}
.card-head .link{margin-top:0}

/* ── Cards ── */
.card{background:var(--card);border-radius:var(--r-xl);padding:20px;position:relative;overflow:hidden}
.cta{cursor:pointer}
.cta .btn{pointer-events:none}
.coach::after{content:"";position:absolute;right:-26px;bottom:-34px;width:150px;height:130px;background:rgba(255,255,255,.28);clip-path:path('M75 128C75 128 4 84 4 40C4 18 20 2 42 2C57 2 68 10 75 22C82 10 93 2 108 2C130 2 146 18 146 40C146 84 75 128 75 128Z');pointer-events:none}
.coach>*{position:relative;z-index:1}
.coach.big h3{font-size:26px}
.coach .eg{margin-top:12px;font-size:14px}
.why{margin:12px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.why li{font-size:14px;color:var(--ink-2);padding-left:18px;position:relative}
.why li::before{content:"";position:absolute;left:2px;top:7px;width:7px;height:7px;border-radius:50%;background:var(--ink)}
.alt{font-size:14px;margin-top:10px;color:var(--ink-2)}
.done-line{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:14px;background:rgba(255,255,255,.4);padding:8px 12px;border-radius:12px}
.done-line .ic{width:16px;height:16px}

/* ring */
.ring{position:relative;max-width:330px;width:100%;margin:0 auto;aspect-ratio:1;cursor:pointer}
.ring-svg{width:100%;height:100%;display:block}
.arc{fill:none;stroke-width:38;stroke-linecap:round}
.arc.off{stroke:var(--card-2)}
.ring-ic{color:var(--ink)}
.ring-ic.off{color:var(--muted)}
.ring-mid{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;pointer-events:none}
.ring-mid b{font-size:84px;font-weight:500;line-height:.95;letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.ring-mid span{font-size:15px;color:var(--ink-2);margin-top:4px}
.ring-mid small{font-size:12px;color:var(--muted);margin-top:2px}
.actions{display:flex;gap:10px;align-items:center}

/* highlights */
.highlights{cursor:pointer}
.hl-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.hl{position:relative;aspect-ratio:1}
.hl-shape{position:absolute;inset:0;width:100%;height:100%}
.hl-shape.t-pink{fill:var(--pink);background:none}.hl-shape.t-blue{fill:var(--blue);background:none}.hl-shape.t-yellow{fill:var(--yellow);background:none}.hl-shape.t-green{fill:var(--green);background:none}
.hl-txt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.hl-txt b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.1}
.hl-txt b small{font-size:11px;font-weight:500}
.hl-txt span{font-size:11px;color:var(--ink-2)}

/* lists */
.list{background:var(--card);border-radius:var(--r-lg);padding:6px;display:flex;flex-direction:column}
.list.flat{background:transparent;padding:0}
.row{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:16px;text-align:left;width:100%}
button.row:hover{background:var(--card-2)}
.row.static{cursor:default}
.row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.row-main b{font-weight:500;font-size:15px}
.row-main small{font-size:13px;color:var(--muted)}
.row-main .note-sm{color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{color:var(--muted)}
.dot{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex-shrink:0;color:var(--ink)}
.dot .ic{width:19px;height:19px}
.badge{background:var(--ink);color:var(--bg);font-size:12px;font-weight:500;padding:2px 8px;border-radius:8px;font-variant-numeric:tabular-nums}
.empty{color:var(--muted);padding:16px 12px;font-size:14px}
.vals{display:flex;align-items:baseline;gap:4px;font-variant-numeric:tabular-nums}
.vals b{font-weight:500;font-size:16px;margin-left:10px}
.vals small{font-size:12px;color:var(--muted)}
.mini-chips{display:flex;gap:4px;flex-wrap:wrap;margin:3px 0 1px}
.mini-chips i{font-style:normal;font-size:11px;padding:1px 7px;border-radius:6px}
.mood-dot{width:40px;height:40px;border-radius:50%;background:var(--pink);display:grid;place-items:center;font-weight:600;flex-shrink:0;font-variant-numeric:tabular-nums}
.dots{display:flex;gap:4px}
.dots i{width:8px;height:8px;border-radius:50%;background:var(--card-2)}
.dots i.on{background:var(--ink)}

/* chips */
.chips{display:flex;gap:8px}
.chips.wrap{flex-wrap:wrap;margin-top:12px}
.chips.scroll{overflow-x:auto;scrollbar-width:none;padding-bottom:2px;margin:0 -2px}
.chips.scroll::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:5px;white-space:nowrap;font-size:13px;padding:7px 13px;border-radius:999px;background:var(--card);color:var(--ink-2)}
.chip .ic{width:14px;height:14px}
.chip.on{background:var(--ink);color:var(--bg)}
.gchip{display:inline-flex;align-items:center;gap:6px;font-size:13px;padding:6px 12px 6px 8px;border-radius:999px;box-shadow:inset 0 0 0 1.5px rgba(23,22,20,.18)}
.gchip .ic{width:15px;height:15px}
.tone-pink .gchip{box-shadow:inset 0 0 0 1.5px rgba(23,22,20,.22)}
.note{font-size:14px;color:var(--ink-2);padding:0 4px}

/* tiles */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.tiles.two{grid-template-columns:1fr 1fr}
.tile{border-radius:var(--r-lg);padding:14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile span{font-size:12px;color:var(--ink-2)}
.tile b{font-size:30px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1}
.tile b small{font-size:14px;font-weight:400}
.tile>small{font-size:11px;color:var(--ink-2)}
.tile small.good{color:var(--good);font-weight:500;font-size:12px}
.tile small.bad{color:var(--red);font-weight:500;font-size:12px}

/* muscle group rows */
.groups{display:flex;flex-direction:column;gap:14px}
.grow{display:flex;gap:12px;align-items:center}
.grow-main{flex:1;min-width:0}
.grow-top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.grow-top b{font-weight:500}
.grow small{font-size:12px;color:var(--muted)}
.meter{height:8px;border-radius:4px;background:var(--card-2);margin:6px 0 3px;overflow:hidden}
.meter i{display:block;height:100%;border-radius:4px}
.st{font-size:11px;padding:2px 8px;border-radius:6px;background:var(--card-2);white-space:nowrap}
.st.on{background:var(--ink);color:var(--bg)}
.st.rec{background:var(--blue)}
.st.ready{background:var(--yellow)}

/* timer */
.timer{background:var(--ink);color:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px}
.timer .eyebrow{color:#A9A398}
.timer b{display:block;font-size:44px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.05}
.timer small{color:#A9A398;font-size:13px}
.play{width:64px;height:64px;border-radius:50%;background:var(--pink);color:var(--ink);display:grid;place-items:center;flex-shrink:0}
.play .ic{width:26px;height:26px;fill:currentColor}
.timer.running .play{background:var(--yellow)}

/* baseline */
.stat-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:rgba(255,255,255,.4);border-radius:14px;padding:10px 12px;display:flex;flex-direction:column;min-width:0}
.stat span{font-size:11px;color:var(--ink-2)}
.stat b{font-size:17px;font-weight:500;font-variant-numeric:tabular-nums}
.stat b small{font-size:11px;font-weight:400}
.baseline .small{margin-top:12px}

/* calendar */
.cal .card-head{margin-bottom:10px}
.pill-label{background:var(--pink);padding:6px 14px;border-radius:999px;font-size:14px;font-weight:500}
.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;text-align:center}
.cw{font-size:11px;color:var(--muted);padding-bottom:4px}
.cd{aspect-ratio:1;border-radius:50%;font-size:14px;display:grid;place-items:center;font-variant-numeric:tabular-nums;max-height:44px;justify-self:center;width:100%;max-width:44px}
.cd.td{box-shadow:inset 0 0 0 2px var(--ink);font-weight:600}
.cd.fut{color:var(--muted);opacity:.5}

/* history */
.seg{display:inline-flex;background:var(--card);border-radius:999px;padding:4px;gap:2px;align-self:flex-start}
.seg button{padding:7px 16px;border-radius:999px;font-size:14px;color:var(--ink-2)}
.seg button.on{background:var(--ink);color:var(--bg)}
.period{display:flex;flex-direction:column;gap:8px}
.period-head{display:flex;justify-content:space-between;align-items:baseline;padding:4px 4px 0}
.period-head b{font-weight:500}
.period-head span{font-size:13px;color:var(--muted)}

/* daily */
.week .bars{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-bottom:14px}
.bar-col{display:flex;flex-direction:column;align-items:center;gap:4px}
.bar-val{font-size:12px;font-weight:600;height:16px;font-variant-numeric:tabular-nums}
.bar-track{width:100%;height:92px;border-radius:12px;background:rgba(255,255,255,.45);display:flex;align-items:flex-end;overflow:hidden}
.bar{width:100%;background:var(--ink);border-radius:12px}
.bar-lbl{font-size:11px;color:var(--ink-2)}
.bar-lbl.td{font-weight:700;color:var(--ink)}
.weeks{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.wk{background:var(--card);border-radius:18px;padding:12px;display:flex;flex-direction:column;min-width:0}
.wk span{font-size:11px;color:var(--muted)}
.wk b{font-size:24px;font-weight:500;font-variant-numeric:tabular-nums}
.wk small{font-size:11px;color:var(--muted)}
.wk.fut{opacity:.45}
.rules{margin:12px 0;padding:0;list-style:none;counter-reset:r;display:flex;flex-direction:column;gap:10px}
.rules li{counter-increment:r;display:flex;gap:10px;align-items:flex-start;font-size:15px}
.rules li::before{content:counter(r);width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:13px;flex-shrink:0}
.flag h3{font-size:22px}
.flag-help{font-size:13px;margin-top:10px}
.sel{user-select:all;-webkit-user-select:all;font-size:15px}

/* forms */
.lbl{display:block;font-size:13px;color:var(--muted);margin:16px 2px 7px}
.inp{width:100%;background:var(--card);border:0;border-radius:16px;padding:13px 14px;font:inherit;font-size:16px;color:var(--ink);outline:none;-webkit-appearance:none;appearance:none;min-height:48px}
.inp:focus{box-shadow:inset 0 0 0 2px var(--ink)}
textarea.inp{resize:vertical;min-height:72px;line-height:1.45}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two .lbl{margin-top:16px}
.hint{font-size:13px;color:var(--muted);margin-top:8px;display:flex;gap:6px;align-items:flex-start}
.hint .ic{width:16px;height:16px;margin-top:1px}
.mood{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px}
.mood button{aspect-ratio:1;border-radius:50%;background:var(--card);font-weight:500;font-size:14px;font-variant-numeric:tabular-nums}
.mood button.on{background:var(--pink);box-shadow:inset 0 0 0 2px var(--ink)}
.mood-ends{display:flex;justify-content:space-between;font-size:11px;color:var(--muted);margin-top:6px}
.toggles{background:var(--card);border-radius:20px;padding:4px}
.tg-row{display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px;cursor:pointer}
.tg-row:hover{background:var(--card-2)}
.tg-row.locked{cursor:default}.tg-row.locked:hover{background:none}
.tg-main{flex:1;min-width:0;display:flex;flex-direction:column}
.tg-main b{font-weight:500}
.tg-main small{font-size:12px;color:var(--muted)}
.switch{width:46px;height:28px;border-radius:14px;background:var(--card-2);position:relative;flex-shrink:0;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.switch.on{background:var(--ink)}
.switch.on::after{left:21px;background:var(--pink)}
.tg-row.locked .switch{opacity:.6}
.range{width:100%;accent-color:var(--ink);height:28px}
.ticks{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.dow{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;margin-top:12px}
.dow button{aspect-ratio:1;border-radius:50%;background:var(--card);font-weight:500}
.dow button.on{background:var(--ink);color:var(--bg)}

/* group tiles in logger */
.gtiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.gtile{background:var(--card);border-radius:20px;padding:12px;display:flex;align-items:center;gap:10px;text-align:left;position:relative;min-height:64px}
.gtile b{font-weight:500;font-size:14px;line-height:1.2}
.gtile .dot{width:36px;height:36px}
.gtile.on.t-yellow{background:var(--yellow)}.gtile.on.t-pink{background:var(--pink)}.gtile.on.t-green{background:var(--green)}.gtile.on.t-blue{background:var(--blue)}
.gtile.on .dot{background:rgba(255,255,255,.55)}
.gtile em{position:absolute;top:6px;right:8px;font-style:normal;font-size:10px;background:var(--ink);color:var(--bg);padding:1px 6px;border-radius:6px}
.gtile .tick{position:absolute;top:8px;right:8px;width:20px;height:20px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center}
.gtile .tick .ic{width:13px;height:13px}

/* profile */
.who{display:flex;gap:16px;align-items:center;padding:6px 0 4px}
.who h1{font-size:34px;line-height:1.05}
.avatar{width:96px;height:96px;border-radius:24px;background:var(--pink);display:grid;place-items:center;font-size:42px;font-weight:600;position:relative;flex-shrink:0}
.spark{position:absolute;right:-10px;top:-10px;width:36px;height:36px;background:var(--yellow);clip-path:polygon(50% 0,63% 20%,88% 12%,80% 37%,100% 50%,80% 63%,88% 88%,63% 80%,50% 100%,37% 80%,12% 88%,20% 63%,0 50%,20% 37%,12% 12%,37% 20%);display:grid;place-items:center}
.spark .ic{width:14px;height:14px}
.facts{display:flex;gap:16px;margin-top:8px;flex-wrap:wrap}
.facts span{font-size:11px;color:var(--muted);display:flex;flex-direction:column;text-transform:uppercase;letter-spacing:.05em}
.facts b{font-size:15px;color:var(--ink);font-weight:500;text-transform:none;letter-spacing:0;font-variant-numeric:tabular-nums}
.idbar{background:var(--green);border-radius:999px;padding:11px 18px;display:flex;justify-content:space-between;gap:10px;font-size:13px;flex-wrap:wrap}
.sources{display:flex;flex-direction:column;gap:10px;margin-top:12px}
.src{background:var(--card);border-radius:16px;padding:12px 14px}
.src b{font-weight:500}
.src p{font-size:14px;color:var(--ink-2);margin:2px 0 4px}
.src small{font-size:12px;color:var(--muted)}

/* overlays */
.ov{position:fixed;inset:0;z-index:200;background:rgba(23,22,20,.36);display:flex;align-items:flex-end;justify-content:center;animation:fade .15s ease}
.modal{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:28px 28px 0 0;padding:20px var(--gut-r) calc(24px + env(safe-area-inset-bottom,0px)) var(--gut);animation:up .22s cubic-bezier(.3,.8,.3,1);overscroll-behavior:contain}
@keyframes up{from{transform:translateY(40px);opacity:.5}}
.modal h3{font-size:22px;margin-bottom:6px}
.modal-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:4px}
.modal-head h2{font-size:26px}
.grab{width:40px;height:4px;border-radius:2px;background:var(--card-2);margin:-8px auto 14px}

#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translate(-50%,8px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:300;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;max-width:calc(100% - 32px);text-align:center}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* small phones */
@media (max-width:370px){
  .hl-txt b{font-size:14px}
  .tile b{font-size:24px}
  .ring-mid b{font-size:68px}
}

/* ── Desktop dashboard ── */
@media (min-width:1000px){
  #app{display:grid;grid-template-columns:260px minmax(0,1fr);gap:8px;padding-left:max(16px,env(safe-area-inset-left,0px))}
  #side{display:flex;flex-direction:column;position:sticky;top:16px;height:calc(100vh - 32px);margin:16px 0;background:var(--ink);color:var(--bg);border-radius:30px;padding:26px 16px 18px}
  #side .wordmark{color:var(--bg);padding:0 10px 26px;font-size:24px}
  #side .wordmark i{color:var(--ink)}
  .side-lbl{font-size:12px;color:#8C877C;padding:0 12px 8px}
  .side-nav{display:flex;flex-direction:column;gap:2px}
  .side-nav button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:14px;color:#C9C3B6;font-size:15px;text-align:left}
  .side-nav button:hover{background:#262420}
  .side-nav button.on{color:var(--bg);background:#2C2A25}
  .side-nav button.on .ic{color:var(--pink)}
  .side-add{margin:18px 4px 0;background:var(--pink);color:var(--ink);border-radius:999px;padding:13px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:500}
  #side-extra{margin-top:auto;display:flex;flex-direction:column;gap:10px}
  .side-timer{display:flex;align-items:center;gap:10px;background:#2C2A25;border-radius:14px;padding:12px;color:var(--yellow);font-variant-numeric:tabular-nums;font-size:18px}
  .side-sync{display:flex;align-items:center;gap:8px;font-size:12px;color:#8C877C;padding:0 8px}
  .side-sync .ic{width:16px;height:16px}
  #top,#tabs{display:none}
  main{padding:26px max(28px,env(safe-area-inset-right,0px)) 40px 20px;max-width:1480px}
  .hello h1{font-size:44px}
  .page-head h1{font-size:44px}
  .cols{display:grid;grid-template-columns:1.05fr 1fr 1fr;gap:20px;align-items:start}
  .cols.pair{grid-template-columns:1fr 1fr}
  .modal{border-radius:28px;max-height:88vh;padding:24px 28px}
  .ov{align-items:center;padding:24px}
  .gtiles{grid-template-columns:repeat(4,minmax(0,1fr))}
  .gtile{flex-direction:column;align-items:flex-start;min-height:104px}
  #toast{bottom:32px}
}
@media (min-width:1000px) and (max-width:1240px){
  .cols{grid-template-columns:1fr 1fr}
  .cols>.col:nth-child(3){grid-column:1 / -1;display:grid;grid-template-columns:1fr 1fr;align-items:start}
}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
<!--/ART-HEAD-->
</head>
